# ============================================================================
# PICOM — VM 01-Arch-Sec / QEMU-KVM / Single Monitor
# Fork: yshui oficial (extra/picom) v13
# Backend: xrender (sem GPU dedicada — GLX não disponível na VM)
#
# DIFERENÇAS vs host:
# - backend: glx → xrender  (GLX requer GPU dedicada)
# - vsync: true → false      (sem VBlank real em VM)
# - removido: xrender-sync-fence, no-use-damage, unredir-if-possible
#   (workarounds NVIDIA — irrelevantes sem GPU dedicada)
# - dithered-present removido (GLX only)
#
# Todo o visual (sombras, bordas arredondadas, animações, rules) é idêntico
# ao host.
# ============================================================================

backend = "xrender";
vsync = false;
no-use-damage = true;

# Só loga warnings e erros reais
log-level = "warn";

# ============================================================================
# SOMBRAS
# ============================================================================

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#10101a";

# ============================================================================
# BORDAS ARREDONDADAS
# ============================================================================

corner-radius = 4;

# ============================================================================
# ANIMAÇÕES
# ============================================================================

animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.7;
    duration = 0.3;
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.25;
});

# ============================================================================
# WINDOW RULES
# ============================================================================

rules = (
    # Fullscreen: sem corner-radius
    { match = "fullscreen"; corner-radius = 0; },

    # Dock e Polybar: sem sombra, sem bordas, sem animação
    {
        match = "window_type = 'dock' || name = 'Polybar'";
        shadow = false;
        corner-radius = 0;
        animations = ();
    },

    # Desktop: sem sombra, sem bordas
    {
        match = "window_type = 'desktop'";
        shadow = false;
        corner-radius = 0;
        animations = ();
    },

    # i3 frame interno: sem sombra duplicada nas bordas entre tiles
    { match = "class_g = 'i3-frame'"; shadow = false; },

    # GTK3/4 com Client Side Decorations: picom não sobrepõe sombra
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },

    # Menus e popups: sem sombra, sem animação
    {
        match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
        shadow = false;
        animations = ();
    },

    # Tooltips: sem sombra, sem animação
    { match = "window_type = 'tooltip'"; shadow = false; animations = (); },

    # Dialogs: sem animação
    { match = "window_type = 'dialog'"; animations = (); },

    # Utility e combo
    { match = "window_type = 'utility' || window_type = 'combo'"; animations = (); },

    # Transparência por aplicação
    { match = "class_g = 'Thunar'"; opacity = 0.97; }
);

# ============================================================================
# FOCO
# ============================================================================

use-ewmh-active-win = true;

fading = false;
