# ============================================================================
# PICOM — ArchLinux · i3wm · NVIDIA GTX 1660 SUPER · Dual Monitor 60Hz
# Fork: yshui oficial (extra/picom) v13
# Backend: GLX + ForceCompositionPipeline (20-nvidia.conf)
# Última atualização: Abril 2026
# ============================================================================
#
# DECISÕES VALIDADAS:
#
# vsync = true — Sem vsync o picom renderiza frames sem limitação, causando
#   100% de GPU. ForceCompositionPipeline opera no nível de scanout do driver;
#   vsync do picom opera no nível de compositing. Coexistem sem conflito.
#
# no-use-damage = true — Causa raiz dos flickerings com NVIDIA + GLX. O damage
#   tracking acumula eventos mais rápido do que o backend consegue renderizar
#   (confirmado em logs: backend_busy repetindo 25+ vezes, render deviation
#   escalando de 380µs para 2456µs durante scroll rápido).
#
# xrender-sync-fence = true — Sincroniza draw calls dos clientes antes do picom
#   ler o pixmap. Documentado na manpage como necessário para NVIDIA + GLX.
#
# unredir-if-possible = false — Com NVIDIA proprietário + GLX, unredirection
#   causa flickering ao redirecionar/desredirecionar janelas.
#
# TripleBuffer + ForceCompositionPipeline: gerenciados pelo driver em
#   /etc/X11/xorg.conf.d/20-nvidia.conf.
# GPUPowerMizerMode=1: GPU no clock máximo via ~/.nvidia-settings-rc.
#   Elimina micro-stuttering causado por transições de clock durante GLX.
# ============================================================================

backend = "glx";
vsync = true;
xrender-sync-fence = true;
no-use-damage = true;
unredir-if-possible = false;

# Só loga warnings e erros reais — evita noise desnecessário no journal
log-level = "warn";

# Desabilita dithering explicitamente — sem benefício visível em monitores
# de 8 bits (AOC 27G2G4) e pode adicionar overhead de processamento com GLX
dithered-present = false;

# ============================================================================
# SOMBRAS
#
# shadow-color com leve tom azul-escuro (#10101a) fica mais suave com temas
# escuros (Skeuos-Cyan-Dark) do que o preto puro padrão (#000000).
# shadow-radius 16 + shadow-opacity 0.5 combinam melhor com corner-radius 8
# — sombra mais difusa e suave, visual próximo ao Hyprland.
# ============================================================================

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#10101a";

# ============================================================================
# BORDAS ARREDONDADAS
#
# O corner-radius global é aplicado em todas as janelas por padrão.
# Exceções (dock, desktop, fullscreen) são tratadas nas rules abaixo.
# Menus e popups também recebem arredondamento sem sombra — visual limpo.
# ============================================================================

corner-radius = 8;

# ============================================================================
# ANIMAÇÕES
# ============================================================================
animations = ({
    triggers = [ "open", "show" ];
    preset = "appear";
    scale = 0.7;
    duration = 0.3;
}, {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.25;
});

# ============================================================================
# WINDOW RULES
#
# Sistema unificado do yshui v13.
# Processadas em sequência — a última regra correspondente vence.
# ============================================================================

rules = (
    # Fullscreen: yshui v13 não desabilita corner-radius automaticamente
    { match = "fullscreen"; corner-radius = 0; },

    # Dock e Polybar: sem sombra, sem bordas, sem animação
    {
        match = "window_type = 'dock' || name = 'Polybar'";
        shadow = false;
        corner-radius = 0;
        animations = ();
    },

    # Desktop: sem sombra, sem bordas
    {
        match = "window_type = 'desktop'";
        shadow = false;
        corner-radius = 0;
        animations = ();
    },

    # i3 cria janelas internas de frame que receberiam sombras duplicadas
    # nas bordas entre tiles sem esta rule.
    { match = "class_g = 'i3-frame'"; shadow = false; },

    # Janelas GTK3/4 com Client Side Decorations reservam margem transparente
    # para sombra própria — picom não deve sobrepor sombra nessa área.
    { match = "_GTK_FRAME_EXTENTS@"; shadow = false; },

    # Menus e popups: sem sombra, sem animação.
    # Sombra em menus causa "padding fantasma" em apps Chromium e GTK
    # (reservam margem interna para sombra própria). O corner-radius
    # global já arredonda os menus — visual limpo sem sombra.
    {
        match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
        shadow = false;
        animations = ();
    },

    # Tooltips: sem sombra, sem animação
    { match = "window_type = 'tooltip'"; shadow = false; animations = (); },

    # Dialogs: sem animação — animações causam flickering durante troca de
    # foco entre dialog e janela pai (confirmado com Brave + file picker).
    { match = "window_type = 'dialog'"; animations = (); },

    # Utility e combo: janelas auxiliares, animação fica visualmente estranha
    { match = "window_type = 'utility' || window_type = 'combo'"; animations = (); },

    # Transparência por aplicação
    { match = "class_g = 'Thunar'";       opacity = 0.97; }
);

# ============================================================================
# FOCO
#
# O picom lê _NET_ACTIVE_WINDOW para saber qual janela está focada.
# O i3 escreve essa propriedade (confirmado via xprop). Sem conflito.
# ============================================================================

use-ewmh-active-win = true;

fading = false;
