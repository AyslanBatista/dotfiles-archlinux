; =============================================================================
; Polybar config
; Monitor primário: DP-2  →  barra [bar/main]      (com tray)
; Monitor secundário:     →  barra [bar/secondary] (sem tray)
; =============================================================================

; -----------------------------------------------------------------------------
; CORES
; -----------------------------------------------------------------------------
[colors]
background      = #770a0f1a
background-alt  = #440a0f1a

foreground      = #e0e8ff
primary         = #50E96479
secondary       = #507DB9B6
active          = #1a4a7a
occupied        = #0d2a4a
urgent          = #FF0000

cyan            = #00FFFF
blue            = #2777ff
green           = #9ece6a
Lime            = #00FF00
red             = #C71818
gold            = #FFD700
yellow          = #FFFF00
orange          = #FFA500
orangered       = #FF4500
grey            = #8b8b8b
darkgrey        = #1a1f2e
purple          = #e345ff


border          = #9902d2f7

; -----------------------------------------------------------------------------
; FONTES — compartilhadas entre as duas barras via herança
; font-0: texto bold (labels, números)
; font-1: texto normal
; font-2: ícones Nerd Fonts (inclui FontAwesome, Material, etc.)
; -----------------------------------------------------------------------------
[bar/base]
width           = 100%
height          = 24
radius          = 10.0
fixed-center    = true

background      = ${colors.background}
foreground      = ${colors.foreground}

border-size     = 2
border-color    = ${colors.border}

padding-left    = 2
padding-right   = 2

module-margin-left  = 1
module-margin-right = 1

font-0 = "JetBrainsMono Nerd Font:size=9:weight=bold;2"
font-1 = "JetBrainsMono Nerd Font:size=9;2"
font-2 = "Symbols Nerd Font Mono:size=10;2"
font-3 = "Noto Color Emoji:scale=10;2"
font-4 = "LionFace:style=Regular:size=15;5"

wm-restack   = i3
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

; -----------------------------------------------------------------------------
; BARRA PRINCIPAL — DP-2 (com tray)
; -----------------------------------------------------------------------------
[bar/main]
inherit = bar/base
monitor = ${env:MONITOR:DP-2}

modules-left   = appmenu i3 xwindow-dp2
modules-center = date
modules-right  = cpu-script temperature memory-script gpu-script disk-script bandwidth volume ppd-status powermenu updates-alert tray

; -----------------------------------------------------------------------------
; BARRA SECUNDÁRIA — sem tray
; -----------------------------------------------------------------------------
[bar/secondary]
inherit = bar/base
monitor        = ${env:MONITOR:HDMI-0}
monitor-strict = true

modules-left   = appmenu i3 xwindow-hdmi0
modules-center = date
modules-right  = cpu-script temperature memory-script gpu-script disk-script bandwidth volume ppd-status powermenu updates-alert

; -----------------------------------------------------------------------------
; TRAY — só aparece na barra main
; -----------------------------------------------------------------------------
[module/tray]
type          = internal/tray
format-margin = 6px
tray-spacing  = 6px

; -----------------------------------------------------------------------------
; DATA E HORA
; -----------------------------------------------------------------------------
[module/date]
type     = custom/script
exec     = date "+%A %d %b %H:%M:%S"
interval = 1
tail     = false

format-prefix            = " "
format-prefix-foreground = ${colors.foreground}

label            = %output%
label-foreground = ${colors.foreground}

click-left = ~/.config/polybar/scripts/calendar.sh &

; -----------------------------------------------------------------------------
; APPMENU
; -----------------------------------------------------------------------------
[module/appmenu]
type = custom/text

content = %{F#02d2f7}%{T5}%{O-2}%{O-0}%{T-}%{F-}

click-left = rofi -show drun -show-icons

; -----------------------------------------------------------------------------
; POWERMENU
; -----------------------------------------------------------------------------
[module/powermenu]
type = custom/text

content            = ""
content-foreground = ${colors.red}

click-left = ~/.config/i3/scripts/powermenu

; -----------------------------------------------------------------------------
; CPU
; T_WARN/T_CRIT passados como env vars no exec
; Script roda em loop (tail=true), Polybar lê stdout continuamente
; -----------------------------------------------------------------------------
[module/cpu-script]
type     = custom/script
exec     = T_WARN=50 T_CRIT=80 ~/.config/polybar/scripts/cpu_usage
tail     = true
interval = 0

click-left = ghostty -e btop &

; -----------------------------------------------------------------------------
; TEMPERATURA
; -----------------------------------------------------------------------------
[module/temperature]
type     = custom/script
exec     = T_WARN=70 T_CRIT=90 ~/.config/polybar/scripts/temperature
interval = 30

click-left = ghostty -e watch -n1 sensors &

; -----------------------------------------------------------------------------
; MEMÓRIA
; Ícone estático no prefix, valor colorido via script
; -----------------------------------------------------------------------------
[module/memory-script]
type     = custom/script
exec     = ~/.config/polybar/scripts/memory
interval = 5

format-prefix-foreground = ${colors.foreground}

click-left = ghostty -e btop &

; -----------------------------------------------------------------------------
; DISCO
; Fica vermelho quando espaço livre < ALERT_LOW %
; -----------------------------------------------------------------------------
[module/disk-script]
type     = custom/script
exec     = BLOCK_INSTANCE=/ ALERT_LOW=10 ~/.config/polybar/scripts/disk
interval = 30

format-prefix            = "󰋊 "
format-prefix-foreground = ${colors.foreground}

click-left = ghostty -e ncdu / &
; -----------------------------------------------------------------------------
; GPU
; Cor muda por threshold: normal → yellow → orange → red
; -----------------------------------------------------------------------------
[module/gpu-script]
type     = custom/script
exec     = ~/.config/polybar/scripts/gpu_usage
tail     = true
interval = 0

click-left = ghostty -e nvtop &
; -----------------------------------------------------------------------------
; BANDWIDTH
; Script roda em loop (tail=true), Polybar lê stdout continuamente
; -----------------------------------------------------------------------------
[module/bandwidth]
type     = custom/script
exec     = UNIT=MB DT=3 ~/.config/polybar/scripts/bandwidth
tail     = true
interval = 0

click-left = ghostty -e nethogs &
; -----------------------------------------------------------------------------
; VOLUME
; -----------------------------------------------------------------------------

[module/volume]
type       = internal/pulseaudio
use-ui-max = true

format-volume = <ramp-volume><label-volume>
format-muted  = <label-muted>

label-volume           = %percentage%%
label-muted            =  " muted"
label-muted-foreground = ${colors.red}


ramp-volume-0          = "  "
ramp-volume-1          = "  "
ramp-volume-2          = "  "
ramp-volume-3          = "  "
ramp-volume-foreground = ${colors.foreground}

scroll-up   = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
click-right = pavucontrol &

; -----------------------------------------------------------------------------
; POWER-PROFILE STATUS
; Ícone + cor muda: performance=red, balanced=green, power-saver=cyan
; -----------------------------------------------------------------------------
[module/ppd-status]
type        = custom/script
exec        = ~/.config/polybar/scripts/ppd-status
tail        = true

click-left  = ~/.config/i3/scripts/power-profiles

; -----------------------------------------------------------------------------
; UPDATES ALERT
; Só aparece na barra quando atingir o threshold definido
; -----------------------------------------------------------------------------
[module/updates-alert]
type     = custom/script
exec     = ~/.config/polybar/scripts/updates-alert.sh 50
interval = 600

format-prefix            = ""
label                    = %output%
label-foreground         = ${colors.cyan}

; -----------------------------------------------------------------------------
; JANELA ATIVA — event-driven via i3 IPC
; -----------------------------------------------------------------------------
[module/xwindow-dp2]
type     = custom/script
exec     = ~/.config/polybar/scripts/xwindow.py DP-2
tail     = true
interval = 0

format-prefix            = "  "
format-prefix-foreground = ${colors.cyan}

label            = %output%
label-foreground = ${colors.foreground}

[module/xwindow-hdmi0]
type     = custom/script
exec     = ~/.config/polybar/scripts/xwindow.py HDMI-0
tail     = true
interval = 0

format-prefix            = "  "
format-prefix-foreground = ${colors.cyan}

label            = %output%
label-foreground = ${colors.foreground}

; -----------------------------------------------------------------------------
; WORKSPACES
; -----------------------------------------------------------------------------
[module/i3]
type = internal/i3

; Só mostra workspaces no monitor onde a barra está (mantém o seu setup dual-monitor funcionando)
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false

; Equivalente ao label-active
label-focused            = %name%
label-focused-background = ${colors.active}
label-focused-foreground = ${colors.cyan}
label-focused-underline  = ${colors.cyan}
label-focused-padding    = 1

; Equivalente ao label-occupied
label-unfocused            = %name%
label-unfocused-background = ${colors.occupied}
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding    = 1

; A MÁGICA ACONTECE AQUI: Urgente agora funciona 100%
label-urgent            = %name%
label-urgent-background = ${colors.urgent}
label-urgent-padding    = 1

; Workspaces visíveis em outros monitores
label-visible            = %name%
label-visible-background = ${colors.background}
label-visible-padding    = 1

; -----------------------------------------------------------------------------
; CONFIGURAÇÕES GLOBAIS
; -----------------------------------------------------------------------------
[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
