# ============================================================================
# NVIDIA GTX 1660 SUPER — Xorg configuration
# DP-2:   AOC 27G2G4 @ 60Hz (monitor principal)
# HDMI-0: segundo monitor @ 60Hz
# Última atualização: Março 2026
# ============================================================================
# ForceCompositionPipeline=On: necessário em dual monitor com picom/GLX para
#   evitar tearing. Também gerencia o vsync no lugar do picom (por isso
#   vsync = false no picom.conf).
# TripleBuffer: reduz latência com ForceCompositionPipeline ativo.
# AllowIndirectGLXProtocol off: desabilita GLX indireto — sem uso em desktop
#   moderno, desabilitar é recomendado pela documentação NVIDIA.
# ============================================================================

Section "Device"
    Identifier "Device0"
    Driver     "nvidia"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Device0"
    Option "metamodes"               "DP-2: 1920x1080_60 +0+0 {ForceCompositionPipeline=On}, HDMI-0: 1920x1080_60 +1920+0 {ForceCompositionPipeline=On}"
    Option "TripleBuffer"            "true"
    Option "AllowIndirectGLXProtocol" "off"
EndSection
